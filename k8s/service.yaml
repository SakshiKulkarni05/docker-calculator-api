# Kubernetes Service — Calculator API
# Gives the Pods a stable network address and exposes them on your local machine

apiVersion: v1
kind: Service
metadata:
  name: calculator-api-service  # Name of this Service

spec:
  type: NodePort                # Exposes the app on a port of your local machine

  selector:
    app: calculator-api         # Routes traffic to Pods with this label

  ports:
    - protocol: TCP
      port: 80                  # Port the Service listens on (inside the cluster)
      targetPort: 8000          # Port the container is running on
      nodePort: 30080           # Port exposed on your local machine (access via localhost:30080)
